version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: auth-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # This line maps the database storage DIRECTLY into a folder in your project!
      - ./postgres_data:/var/lib/postgresql